<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>JANGO - Assistant Scolaire & Tuteur IA</title>
    <meta name="description" content="Assistant IA intelligent & tuteur d'exercices tout-en-un avec résolution par photo, synthèse vocale et explications étape par étape." />
    <meta property="og:title" content="JANGO - Assistant Scolaire & Tuteur IA" />
    <meta property="og:description" content="Assistant IA intelligent & tuteur d'exercices tout-en-un avec résolution par photo, synthèse vocale et explications étape par étape." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      try {
        const theme = localStorage.getItem('jangoia_theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased overflow-hidden select-none bg-[var(--bg-primary)] text-[var(--text-primary)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
